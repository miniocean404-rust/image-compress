[package]
name = "image_compress_core"
version.workspace = true
edition.workspace = true

[features]
default = ["wasm", "operations", "native"]

wasm = ["mem", "png"]
native = ["jpeg", "webp", "gif", "tiff", "avif"]
operations = ["transform", "resize", "icc", "quantize"]

mem = []

transform = ["dep:webp"]
resize = ["dep:fast_image_resize"]
icc = []
quantize = []

png = ["dep:oxipng", "dep:imagequant", "dep:lodepng", "dep:png"]
webp = ["dep:webp"]
jpeg = ["dep:mozjpeg", "dep:mozjpeg-sys"]
gif = ["dep:gifsicle", "dep:gif"]
avif = ["dep:libavif", "dep:ravif"]
tiff = ["dep:tiff"]


metadata = []


[dependencies]
# utils = { path = "../utils" }
# tokio = { workspace = true, default-features = false, features = [
#     "rt-multi-thread",
#     "rt",
# ] }

# 图像处理
image.workspace = true

rgb.workspace = true
resize.workspace = true
# 使用 SIMD 指令快速调整图像大小的库
fast_image_resize = { workspace = true, optional = true }
# ICC 颜色配置文件处理。 rust 包装 little cms
lcms2.workspace = true

zune-core = "0.5.1"
zune-image = "0.5.0"

# PNG
# PNG # 无损压缩 png (optipng、oxipng) 编译 wasm 需要安装 clang 环境
oxipng = { version = "10.1.1", default-features = false, optional = true, features = [
  "freestanding",
  "parallel",
  "zopfli",
] }
# 有损压缩 png 把 png24 压缩成 png8 的库 是 pngquant 的包装
imagequant = { version = "4.4.1", default-features = true, optional = true }
# wasm 需要禁止 ffi
lodepng = { version = "3.12.2", default-features = false, optional = true, features = [
  "rust_backend",
] }
png = { version = "0.18.1", optional = true }


# JPEG
mozjpeg = { version = "0.10.13", default-features = false, optional = true, features = [
  "with_simd",
] }
mozjpeg-sys = { version = "2.2.3", optional = true, features = ["default"] }


# GIF gifsicle 是读取以及 有损及无损压缩 gif 的库
gif = { version = "0.14.2", optional = true }
gifsicle = { version = "1.95.0", optional = true }
libc = "0.2.186"


# WebP, 底层使用的是 rust libwebp-sys# webp 无损压缩及有损压缩
webp = { version = "0.3.1", default-features = true, optional = true }
libwebp-sys = "0.14.4"


# AVIF
ravif = { version = "0.13.0", optional = true }
libavif = { version = "0.14.0", default-features = false, optional = true, features = [
  "codec-aom",
] }


# TIFF
tiff = { version = "0.11.3", default-features = false, optional = true }

# SVG
svgtypes = "0.16.1"


# 序列化
serde.workspace = true
serde_json.workspace = true

# 时间处理
chrono.workspace = true

# 错误处理
anyhow.workspace = true
thiserror.workspace = true

# 日志
tracing.workspace = true
tracing-appender.workspace = true
tracing-subscriber.workspace = true

# 文件类型推断
infer.workspace = true

# 文件系统
globset.workspace = true
walkdir.workspace = true

# 系统信息
num_cpus.workspace = true

[dev-dependencies]
zune-core = { version = "0.5.1", features = ["std"] }
cargo_metadata.workspace = true
